    <g clip-path="url(#sources-screen)">
      <rect x="858" y="52" width="252" height="526" fill="#ffffff"/>
      <text x="880" y="97" fill="#111113"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="750" letter-spacing="-0.5">Sources</text>
      <circle cx="1081" cy="91" r="14" fill="#111113"/>
      <path d="M1081 84v14M1074 91h14" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

      <rect x="878" y="122" width="212" height="1" fill="#e7e7e9"/>

      <g>
        <circle cx="901" cy="166" r="19" fill="#111113"/>
        <text x="901" y="172" text-anchor="middle" fill="#ffffff"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="20" font-weight="700">d</text>
        <rect x="934" y="156" width="84" height="7" rx="3.5" fill="#252529"/>
        <rect x="934" y="173" width="58" height="6" rx="3" fill="#c7c7cb"/>
        <path d="M1068 164l5 5-5 5" fill="none" stroke="#b9b9be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g>
        <circle cx="901" cy="235" r="19" fill="#e1e1e4"/>
        <rect x="934" y="225" width="78" height="7" rx="3.5" fill="#252529"/>
        <rect x="934" y="242" width="70" height="6" rx="3" fill="#c7c7cb"/>
        <path d="M1068 233l5 5-5 5" fill="none" stroke="#b9b9be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g>
        <circle cx="901" cy="304" r="19" fill="#111113"/>
        <path d="M893 304a8 8 0 0116 0M896 304a5 5 0 0110 0M899 304a2 2 0 014 0v6a2 2 0 01-4 0z" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="934" y="294" width="92" height="7" rx="3.5" fill="#252529"/>
        <rect x="934" y="311" width="64" height="6" rx="3" fill="#c7c7cb"/>
        <path d="M1068 302l5 5-5 5" fill="none" stroke="#b9b9be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g>
        <circle cx="901" cy="373" r="19" fill="#e1e1e4"/>
        <rect x="934" y="363" width="72" height="7" rx="3.5" fill="#252529"/>
        <rect x="934" y="380" width="86" height="6" rx="3" fill="#c7c7cb"/>
        <path d="M1068 371l5 5-5 5" fill="none" stroke="#b9b9be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>