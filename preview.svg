<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Dispatch</title>
  <desc>Preview composed from real mobile product screens.</desc>
  <defs>
    <filter id="screen-shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#55565b" flood-opacity=".20"/>
    </filter>
    <filter id="screen-tone" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0.08"/>
    </filter>
    <clipPath id="logo-mask"><rect x="80" y="80" width="176" height="176" rx="40"/></clipPath>
    <clipPath id="screen-0"><rect x="445" y="85" width="310" height="640" rx="29"/></clipPath><clipPath id="screen-1"><rect x="805" y="85" width="310" height="640" rx="29"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#e6e7e9"/>

  <g aria-label="dispatch">
    <rect x="80" y="80" width="176" height="176" rx="40" fill="#fff" stroke="#d2d3d6" stroke-width="1" filter="url(#screen-shadow)"/>
    <g clip-path="url(#logo-mask)"><image xlink:href="data:image/png;base64," x="80" y="80" width="176" height="176" preserveAspectRatio="xMidYMid meet"/></g>
    
    <text x="80" y="338" text-anchor="start"
          font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, Helvetica, Arial, sans-serif"
          font-size="58" font-weight="900" letter-spacing="-0.06em" fill="#111113">dispatch</text>
    
    <text x="80" y="380" text-anchor="start"
          font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, Helvetica, Arial, sans-serif"
          font-size="18" font-weight="400" letter-spacing=".2" fill="#77787c">by gbrlpzz</text>
  </g>

  <g aria-label="Real product screens">
    <g aria-label="real product screen" transform="rotate(0 600 405)">
      <rect x="440" y="80" width="320" height="650" rx="34"
            fill="#111113" filter="url(#screen-shadow)"/>
