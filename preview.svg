<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Dispatch</title>
  <desc>Dispatch mobile feed interface with two views.</desc>
  <defs>
    <clipPath id="feed-screen">
      <rect x="570" y="52" width="252" height="526" rx="32"/>
    </clipPath>
    <clipPath id="sources-screen">
      <rect x="858" y="52" width="252" height="526" rx="32"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f5f5f7"/>

  <g aria-label="Dispatch logo">
    <rect x="112" y="168" width="126" height="126" rx="34" fill="#111113"/>
    <text x="175" y="273" text-anchor="middle" fill="#ffffff"
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
      font-size="96" font-weight="700" letter-spacing="-8">d</text>
    <text x="92" y="414" fill="#111113"
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
      font-size="92" font-weight="800" letter-spacing="-6">dispatch</text>
  </g>

  <g aria-label="Dispatch feed view">
    <rect x="570" y="52" width="252" height="526" rx="32" fill="#ffffff" stroke="#d6d6d9" stroke-width="2"/>
    <g clip-path="url(#feed-screen)">
      <rect x="570" y="52" width="252" height="526" fill="#ffffff"/>
      <text x="592" y="97" fill="#111113"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="750" letter-spacing="-0.5">dispatch</text>
      <text x="800" y="97" text-anchor="end" fill="#111113"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="700">Today</text>

      <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="700" text-anchor="middle">
        <circle cx="600" cy="139" r="19" fill="#f0f0f2"/>
        <text x="600" y="143" fill="#737378">07</text>
        <circle cx="647" cy="139" r="19" fill="#f0f0f2"/>
        <text x="647" y="143" fill="#737378">08</text>
        <circle cx="694" cy="139" r="19" fill="#111113"/>
        <text x="694" y="143" fill="#ffffff">09</text>
        <circle cx="741" cy="139" r="19" fill="#f0f0f2"/>
        <text x="741" y="143" fill="#737378">10</text>
        <circle cx="788" cy="139" r="19" fill="#f0f0f2"/>
        <text x="788" y="143" fill="#737378">11</text>
      </g>

      <g>
        <rect x="590" y="181" width="212" height="126" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
        <rect x="604" y="195" width="58" height="98" rx="12" fill="#d9d9dd"/>
        <path d="M604 262c16-14 25-26 39-19 9 5 12 15 19 10v40h-58z" fill="#b9b9be"/>
        <circle cx="641" cy="218" r="12" fill="#eeeeef"/>
        <rect x="676" y="203" width="108" height="8" rx="4" fill="#252529"/>
        <rect x="676" y="222" width="86" height="7" rx="3.5" fill="#252529"/>
        <rect x="676" y="241" width="56" height="6" rx="3" fill="#bdbdc2"/>
        <rect x="676" y="274" width="76" height="6" rx="3" fill="#d8d8dc"/>
      </g>

      <g>
        <rect x="590" y="321" width="212" height="126" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
        <rect x="604" y="335" width="58" height="98" rx="12" fill="#111113"/>
        <circle cx="633" cy="384" r="18" fill="#2d2d31"/>
        <path d="M628 373l17 11-17 11z" fill="#ffffff"/>
        <rect x="676" y="343" width="92" height="8" rx="4" fill="#252529"/>
        <rect x="676" y="362" width="110" height="7" rx="3.5" fill="#252529"/>
        <rect x="676" y="381" width="58" height="6" rx="3" fill="#bdbdc2"/>
        <rect x="676" y="414" width="82" height="6" rx="3" fill="#d8d8dc"/>
      </g>
    </g>
  </g>

  <g aria-label="Dispatch sources view">
