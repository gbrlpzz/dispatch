<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Dispatch</title>
  <meta name="description" content="Dispatch — a minimal, private, distraction-free personal feed arranged by day. Add Substack, YouTube and podcast feeds, swipe between days, everything stored on your device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dispatch">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta property="og:title" content="Dispatch — your daily feed, kept private">
  <meta property="og:description" content="A minimal, private, distraction-free personal feed arranged by day. Add Substack, YouTube and podcast sources, swipe between days, everything stays on your device.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://dispatch-gbrlpzzs-projects.vercel.app/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Dispatch — your feeds, arranged by day">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://dispatch-gbrlpzzs-projects.vercel.app/preview.svg">
  <meta name="twitter:image:alt" content="Dispatch — your feeds, arranged by day">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot-screen" role="status" aria-live="polite" aria-label="Loading Dispatch">
    <div class="boot-screen__content">
      <span class="boot-screen__spinner" aria-hidden="true"></span>
      <span class="boot-screen__wordmark">dispatch</span>
    </div>
  </div>

  <div id="app">
    <header id="navbar">
      <button id="today-btn" class="nav-btn" aria-label="Jump to today">Today</button>
      <h1 id="nav-title">Today</h1>
      <div class="nav-right">
        <button id="sources-btn" class="nav-btn nav-btn--icon" aria-label="Manage sources" title="Sources">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="5" cy="7" r="1.4" fill="currentColor"/>
            <circle cx="5" cy="12" r="1.4" fill="currentColor"/>
            <circle cx="5" cy="17" r="1.4" fill="currentColor"/>
            <path d="M9 7h10M9 12h10M9 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="add-btn" class="nav-btn nav-btn--icon" aria-label="Add source" title="Add source">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <nav id="strip" aria-label="Choose a day"></nav>

    <main id="pager" aria-live="polite">
      <div id="pull-indicator" hidden>
        <div class="spinner" aria-hidden="true"></div>
      </div>
      <div id="dayview"></div>
    </main>

    <div id="toast" role="status" hidden></div>
  </div>

  <div id="backdrop" hidden></div>

  <section id="sheet" role="dialog" aria-modal="true" hidden>
    <div id="sheet-grabber"></div>
    <div id="sheet-body"></div>
  </section>

  <section id="sources-screen" hidden>
    <header class="screen-nav">
      <button id="sources-done" class="nav-btn">Done</button>
      <h2>Sources</h2>
      <button id="sources-add" class="nav-btn nav-btn--icon" aria-label="Add source">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div id="sources-list"></div>
    <p id="sources-footer">Deleting a source removes its items from every day.</p>
  </section>

  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var hadController = !!navigator.serviceWorker.controller;
        var reloading = false;
        var registration = null;

        function checkForUpdate() {
          if (registration) registration.update().catch(function () {});
        }

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          // The first install needs no reload. On later updates, reload once
          // so the desktop-installed app picks up the new app shell promptly.
          if (!hadController || reloading) return;
          reloading = true;
          window.location.reload();
        });

        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
          .then(function (nextRegistration) {
            registration = nextRegistration;
            return registration.update();
          })
          .catch(function () {});

        window.addEventListener('focus', checkForUpdate);
      });
    }
  </script>
</body>
</html>
